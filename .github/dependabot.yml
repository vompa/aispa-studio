version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      patch-und-minor:
        update-types: ["minor", "patch"]
    ignore:
      # PDFsharp steht ab 6.5.0 unter AGPL-3.0; 6.2.4 ist die letzte MIT-Fassung (ADR 0092)
      - dependency-name: PDFsharp
        versions: [">= 6.3"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
    ignore:
      # openapi-typescript 7 bricht mit TypeScript 7 (gen:api: createKeywordTypeNode undefined); Pin ~6.0 bleibt bis dahin
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
