# Feste Zuordnung für /hubs/ im Mehrinstanz-Betrieb (compose.scale.yaml legt diese Datei in den Upstream api_hubs von nginx.conf).
# hash statt ip_hash: ip_hash wertet nur die ersten drei Oktette der Adresse aus, das ganze Netz eines Ingress oder Docker-Netzes landete
# auf einer Instanz. Ohne consistent: mit consistent ordnet nginx die Adressen eines Docker-DNS-Namens (api) nicht den Instanzen zu und
# verteilt dann doch reihum (gemessen: 23 zu 17 bei 40 Anfragen von einer Adresse).
hash $remote_addr;
