# Liefert die gebaute Web-Oberfläche aus und leitet /api und /hubs an die API weiter, wie der Vite-Server in der Entwicklung.
# Schema für die API: nginx übernimmt ein X-Forwarded-Proto nur von einem Ingress davor, dessen Netz unten bei geo steht; sonst gilt das Schema dieser
# Verbindung ($scheme). Ohne Eintrag gibt nginx also nie den Wert eines Clients weiter. Die API wertet die Kopfzeile nur mit
# Hosting:ForwardedHeaders:Enabled aus und vertraut nur den Netzen aus KnownNetworks bzw. den Proxys aus KnownProxies.
geo $remote_addr $from_ingress {
    default 0;
    # Hier das Netz des Ingress eintragen, zum Beispiel "10.0.8.0/24 1;" (siehe Server-Einstellungen, Abschnitt Hinter Proxy oder Ingress).
}

map "$from_ingress:$http_x_forwarded_proto" $forwarded_proto {
    default $scheme;
    "1:https" https;
    "1:http" http;
}

# Ziel der Live-Verbindungen. Mit mehreren API-Instanzen löst nginx den Namen api beim Start in alle Adressen auf und verteilt reihum;
# für /hubs/ braucht es eine feste Zuordnung (SignalR-Rückfall auf Server-Sent Events oder Long Polling, siehe Server-Einstellungen,
# Abschnitt Live-Meldungen mit mehreren Instanzen). compose.scale.yaml bindet sie über den Ordner hubs-balancing ein; sonst bleibt er leer.
upstream api_hubs {
    include /etc/nginx/conf.d/hubs-balancing/*.conf;
    server api:8080;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Die Wurzel führt auf die Anmeldeseite, mit Abfrage (z. B. ?einladung=…); es gibt keine Startseite mehr. Alles andere ohne Datei oder App antwortet 404.
    location = / {
        return 302 /anmelden/$is_args$args;
    }

    # /health und /alive der API (Hosting:HealthEndpoints) gehen bewusst nicht durch nginx: hier antworten sie mit 404. Proben laufen direkt gegen die Instanz (Port 8080).
    location / {
        try_files $uri =404;
    }

    # Anmelden im Browser: Einladung annehmen, Code für die Windows-App, Passkey, neues Spa registrieren.
    location /anmelden/ {
        try_files $uri $uri/ /anmelden/index.html;
    }

    # Kundenbereich mit Content-Security-Policy, zuerst nur als Bericht (ADR 0080); Text wie BookingContentSecurityPolicy in der API.
    # frame-ancestors steht in einem eigenen, durchsetzenden Header, denn in Report-Only sperrt der Browser nichts. Welche Websites einbetten
    # dürfen, steht je Spa in der Datenbank: die API liefert es für die Unteranfrage (BookingEmbedding in der API).
    location /buchen/ {
        auth_request /embedding-policy;
        auth_request_set $frame_ancestors $upstream_http_x_frame_ancestors;
        add_header Content-Security-Policy "frame-ancestors $frame_ancestors" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
        try_files $uri $uri/ /buchen/index.html;
    }

    # Der Service Worker der Kunden-App darf nicht im Browser-Cache hängen bleiben, sonst kommen Updates nicht an.
    location = /buchen/sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /embedding-policy {
        internal;
        proxy_pass http://api:8080/api/online/embedding-policy;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # „Mein Tag“ für das Handy. Der Service Worker darf nicht im Browser-Cache hängen bleiben, sonst kommen Updates nicht an.
    location /mein-tag/ {
        try_files $uri $uri/ /mein-tag/index.html;
    }

    location = /mein-tag/sw.js {
        add_header Cache-Control "no-cache";
    }

    # Hilfe als eigene Seite (ADR 0079): die Windows-App öffnet sie im eingebetteten Browser.
    location /help/ {
        try_files $uri $uri/ /help/index.html;
    }

    # Erklärseite „Über AISPA Studio“, ohne Anmeldung, aus der Hilfe verlinkt.
    location /ueber/ {
        try_files $uri $uri/ /ueber/index.html;
    }

    # Tafel im Pausenraum (Webmodul Dashboard, ADR 0041 und 0084): Vollbild ohne Bedienelemente.
    location /dashboard/ {
        try_files $uri $uri/ /dashboard/index.html;
    }

    # Seite des Betreibers; ohne Operator:ApiKey antwortet die API dort mit 404.
    location /betreiber/ {
        try_files $uri $uri/ /betreiber/index.html;
    }

    # Host-Kopfzeile bleibt erhalten, damit die Passkey-Prüfung den Ursprung (localhost) wiedererkennt.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        client_max_body_size 25m;
    }

    location /hubs/ {
        proxy_pass http://api_hubs;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
